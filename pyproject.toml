# Configuração do ruff (linter do projeto).
#
# O ruff 0.17+ passou a ligar um conjunto de regras muito maior por padrão
# (YTT/ASYNC/S/BLE...). Este arquivo fixa um seleto conservador: gramática
# (E), bugs clássicos (F), ordem de imports (I), modernização para Python 3.10
# (UP) e bugbear (B). Roda no CI (testes.yml) com `ruff check .`.
#
# Instalar localmente:  python -m pip install ruff   (ou use o .venv/)

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv", "dist", "build", "AppDir"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Estilo do projeto:
#   E501 — linhas longas são comuns (docstrings, tabelas); não vale o churn.
#   E701/E702 — múltiplos statements numa linha são idiomáticos no app.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = false
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = false
show_error_codes = true
# Tkinter/canvas/typing dinâmico geram muitos falsos positivos neste código.
disable_error_code = ["union-attr", "attr-defined", "assignment", "arg-type", "call-overload"]
exclude = [
  "build",
  "dist",
  "AppDir",
  ".venv",
  "navepro/sorteio",
  "navepro/core/telao.py",
  "navepro/core/mediaplayer.py",
]
