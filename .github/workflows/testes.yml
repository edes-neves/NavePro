# Roda a suíte de testes do NavePro nos DOIS sistemas que o projeto atende —
# Windows (NavePro.exe) e Linux (AppImage) — para que uma mudança feita de um
# lado não quebre o outro sem ninguém perceber na mão.
#
# Os testes são headless (fakes de Tk, código extraído via ast) e usam só a
# biblioteca padrão: não pedem display nem servidor. O job `lint` roda o ruff
# (config em pyproject.toml) numa única plataforma — é o único que instala.

name: Testes

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instala o ruff (versão fixada p/ evitar quebra por default novo)
        run: python -m pip install --quiet 'ruff==0.17.0'

      - name: Roda o ruff (config em pyproject.toml)
        run: ruff check .

  testes:
    name: Suíte (${{ matrix.sistema }})
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Roda as suítes
        shell: bash
        env:
          # O console do runner Windows é cp1252: sem o modo UTF-8 do Python,
          # o print dos emojis da suíte (✅, ◀, 📁) estoura UnicodeEncodeError.
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          set -u
          falhas=0
          for f in tests/test_*.py; do
            echo "::group::${f}"
            if python "$f"; then
              echo "OK  ${f}"
            else
              echo "FALHOU  ${f}"
              falhas=$((falhas + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$falhas" -ne 0 ]; then
            echo "${falhas} suíte(s) falharam"
            exit 1
          fi
          echo "Todas as suítes passaram"
