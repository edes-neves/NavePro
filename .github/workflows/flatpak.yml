name: Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Flatpak ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker é exigido pelo docker/setup-qemu-action (instala o binfmt para
      # emular aarch64 dentro do container privilegiado).
      - name: Instalar Docker (aarch64)
        if: matrix.arch != 'x86_64'
        run: |
          curl https://download.docker.com/linux/static/stable/x86_64/docker-26.0.0.tgz --output ./docker.tgz
          tar xzvf docker.tgz
          mv docker/* /usr/bin

      # Registra binfmt para rodar binários aarch64 no runner x86_64
      - name: Set up QEMU (${{ matrix.arch }})
        if: matrix.arch != 'x86_64'
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: ${{ matrix.arch }}
          manifest-path: flatpak/io.github.edesneves.NavePro.yaml
          cache: true
          cache-key: flatpak-${{ matrix.arch }}
          build-bundle: true
          bundle: NavePro-${{ matrix.arch }}.flatpak

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: NavePro-flatpak-${{ matrix.arch }}
          path: NavePro-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  release:
    name: Anexar bundles à release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Anexar à release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/NavePro-flatpak-x86_64/NavePro-x86_64.flatpak
            bundles/NavePro-flatpak-aarch64/NavePro-aarch64.flatpak

  # Publica o repositório Flatpak auto-hospedado (https://edes-neves.github.io/NavePro/)
  # em cada release: constrói x86_64 e adiciona o commit ao ostree publicado no gh-pages.
  # Usuários atualizam com: flatpak update --user io.github.edesneves.NavePro
  publish-repo:
    name: Publicar repositório Flatpak (gh-pages)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A branch gh-pages É o repositório ostree público (config/objects/refs/summary).
      # Constrói-se dentro dela para acumular commits do histórico (delta-only).
      - name: Baixar repositório publicado (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Construir no repositório publicado
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          arch: x86_64
          manifest-path: flatpak/io.github.edesneves.NavePro.yaml
          repo-dir: pages
          build-bundle: false
          upload-artifact: false
          cache: false

      - name: Atualizar metadados do repositório (appstream)
        run: flatpak build-update-repo "$GITHUB_WORKSPACE/pages"

      - name: Publicar no branch gh-pages
        run: |
          cd "$GITHUB_WORKSPACE/pages"
          git config user.name "NavePro Bot"
          git config user.email "edes-neves@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem alterações no repositório; nada a publicar."
          else
            TAG=$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 2>/dev/null || echo "$GITHUB_REF_NAME")
            git commit -m "Publicar NavePro $TAG no repositório Flatpak"
            git push origin gh-pages
          fi